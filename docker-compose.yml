services:
  course-extractor-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: rj-course-extractor-bot:latest
    container_name: rj-course-extractor-bot
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - BOT_TOKEN=${BOT_TOKEN}
      - AUTH_USERS=${AUTH_USERS}
      - PORT=${PORT:-8080}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
